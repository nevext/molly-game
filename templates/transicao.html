<!-- templates/transicao.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly</title>
    <style>
        @font-face {
            font-family: 'Glassure';
            src: url("{{ url_for('static', filename='menu/Glassure.otf') }}") format('opentype');
        }
        @font-face {
            font-family: 'DMSans';
            src: url("{{ url_for('static', filename='menu/DMSans-VariableFont_opsz,wght.ttf') }}") format('truetype');
            font-weight: 100 900;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .tela {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            animation: fadeIn 0.8s ease forwards;
        }

        /* TÍTULO PRINCIPAL — NOITE ou DIA */
        .titulo-periodo {
            font-family: 'Glassure', serif;
            font-size: clamp(5rem, 15vw, 12rem);
            color: #fff;
            letter-spacing: 0.05em;
            line-height: 1;
            opacity: 0;
            animation: aparecer 1s ease 0.3s forwards;
        }

        /* SUBTÍTULO */
        .subtitulo {
            font-family: 'Glassure', serif;
            font-size: clamp(1rem, 3vw, 2rem);
            color: rgba(255,255,255,0.8);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0;
            animation: aparecer 1s ease 1s forwards;
        }

        /* CHOISE em vermelho */
        .choise {
            font-family: 'Glassure', serif;
            font-size: clamp(1.5rem, 4vw, 3rem);
            color: #8b0000;
            letter-spacing: 0.15em;
            opacity: 0;
            animation: aparecer 1s ease 1.8s forwards;
        }

        /* Hint de continuar */
        .hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'DMSans', sans-serif;
            font-size: 0.65rem;
            font-weight: 300;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0;
            animation: aparecer 1s ease 2.5s forwards, piscar 1.5s ease 3s infinite;
        }

        /* Cada caractere aparece individualmente */
        .char {
            display: inline-block;
            opacity: 0;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes piscar {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Variação DIA */
        {% if tipo == 'dia' %}
        .choise { color: #c8a000; }
        {% endif %}
    </style>
</head>
<body onclick="continuar()">

    <div class="tela">
        <div class="titulo-periodo" id="tituloPeriodo">
            {% if tipo == 'noite' %}NOITE{% else %}DIA{% endif %}
        </div>

        <div class="subtitulo" id="subtitulo">
            {% if tipo == 'noite' %}
                A noite foi feita pra se divertir
            {% else %}
                O dia começa de novo
            {% endif %}
        </div>

        <div class="choise" id="choise">CHOISE</div>
    </div>

    <div class="hint">CLIQUE PARA CONTINUAR</div>

    <script>
        // Animação de caracteres no CHOISE
        const choiseEl = document.getElementById('choise');
        const texto = choiseEl.textContent.trim();
        choiseEl.textContent = '';

        texto.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.className = 'char';
            span.textContent = char;
            span.style.animation = `aparecer 0.4s ease ${1.8 + i * 0.12}s forwards`;
            choiseEl.appendChild(span);
        });

        // Clique para continuar
        let podeClicar = false;
        setTimeout(() => { podeClicar = true; }, 2000);

        function continuar() {
            if (!podeClicar) return;
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.6s ease';
            setTimeout(() => {
                window.location.href = '/iniciar_cap';
            }, 600);
        }
    </script>

</body>
</html>
