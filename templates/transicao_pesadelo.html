<!-- templates/transicao_pesadelo.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesadelo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }

        /* Fundo escuro e assustador */
        .pesadelo-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0000 0%, #0d0000 50%, #000 100%);
            z-index: 0;
        }

        /* Efeito de vidro quebrando */
        .vidro-quebrado {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            opacity: 0;
            animation: quebraVidro 2.5s ease-in-out forwards;
        }

        @keyframes quebraVidro {
            0% { opacity: 0; }
            20% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0; transform: scale(1.05); }
        }

        /* Linhas de vidro quebrando */
        .vidro-linha {
            position: absolute;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.8), transparent);
            animation: rachaduraAnim 2.5s ease-in-out forwards;
        }

        @keyframes rachaduraAnim {
            0% { opacity: 0; transform: scale(0); }
            30% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.2); }
        }

        /* Texto assustador */
        .pesadelo-texto {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            opacity: 0;
            animation: apareceTexto 3s ease forwards;
        }

        .pesadelo-titulo {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 300;
            color: rgba(200, 0, 0, 0.9);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(200, 0, 0, 0.8), 0 0 40px rgba(100, 0, 0, 0.6);
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .pesadelo-mensagem {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255, 100, 100, 0.8);
            line-height: 1.8;
            letter-spacing: 0.05em;
            max-width: 500px;
        }

        @keyframes apareceTexto {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            50% { opacity: 0; }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; }
        }

        /* Overlay piscante */
        .overlay-flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(200, 0, 0, 0.1);
            z-index: 3;
            animation: piscarOverlay 0.1s ease infinite;
        }

        @keyframes piscarOverlay {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.2; }
        }

        /* Botão continuar assustador */
        .btn-continuar {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 20;
            background: rgba(139, 0, 0, 0.3);
            border: 2px solid rgba(200, 0, 0, 0.6);
            border-radius: 4px;
            color: rgba(200, 0, 0, 0.8);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            opacity: 0;
            animation: apareceBtn 3.5s ease forwards;
            transition: all 0.3s ease;
        }

        .btn-continuar:hover {
            background: rgba(139, 0, 0, 0.6);
            border-color: rgba(200, 0, 0, 1);
            color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 15px rgba(200, 0, 0, 0.5);
        }

        @keyframes apareceBtn {
            0% { opacity: 0; }
            85% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <audio id="sfxNightmare" autoplay>
        <source src="{{ url_for('static', filename='audio/sfx/sfx_nightmare.mp3') }}" type="audio/mp3">
    </audio>

    <div class="pesadelo-bg"></div>
    <div class="overlay-flicker"></div>
    
    <div class="vidro-quebrado" id="vidroQuebrado">
        <div class="vidro-linha" style="top: 20%; left: 30%; width: 300px; height: 2px; transform: rotate(45deg);"></div>
        <div class="vidro-linha" style="top: 40%; left: 60%; width: 200px; height: 2px; transform: rotate(-30deg);"></div>
        <div class="vidro-linha" style="top: 60%; left: 20%; width: 250px; height: 2px; transform: rotate(60deg);"></div>
        <div class="vidro-linha" style="top: 35%; left: 70%; width: 180px; height: 2px; transform: rotate(-45deg);"></div>
        <div class="vidro-linha" style="top: 55%; left: 50%; width: 200px; height: 2px; transform: rotate(25deg);"></div>
    </div>

    <div class="pesadelo-texto">
        <h1 class="pesadelo-titulo">PESADELO</h1>
        <p class="pesadelo-mensagem">Você quis isso e conseguiu.</p>
    </div>

    <button class="btn-continuar" onclick="irProFinal()">Continuar →</button>

    <script>
        // Reproduzir som de suspense ao carregar
        function playClickSound() {
            const audio = new Audio("{{ url_for('static', filename='audio/sfx/sfx_suspense(Molly).mp3') }}");
            audio.play().catch(e => console.log("Erro ao reproduzir SFX:", e));
        }

        // Reproduzir som ao clicar no botão
        document.querySelector('.btn-continuar').addEventListener('click', function() {
            playClickSound();
            setTimeout(() => {
                irProFinal();
            }, 300);
        });

        function irProFinal() {
            window.location.href = '/final';
        }

        // Reproduzir som de suspense quando a página carrega
        window.addEventListener('load', function() {
            playClickSound();
        });
    </script>
</body>
</html>
