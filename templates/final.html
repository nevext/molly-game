<!-- templates/final.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly</title>
    <style>
        @font-face {
            font-family: 'Glassure';
            src: url("{{ url_for('static', filename='menu/Glassure.otf') }}") format('opentype');
        }
        @font-face {
            font-family: 'DMSans';
            src: url("{{ url_for('static', filename='menu/DMSans-VariableFont_opsz,wght.ttf') }}") format('truetype');
            font-weight: 100 900;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fundo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.25);
            animation: fadeIn 2s ease forwards;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .overlay.bom { background: linear-gradient(to bottom, rgba(0,48,135,0.3), rgba(0,0,0,0.6)); }
        .overlay.ruim { background: linear-gradient(to bottom, rgba(20,0,0,0.5), rgba(0,0,0,0.85)); }

        .personagem {
            position: fixed;
            bottom: 0; right: 8%;
            height: 80vh;
            z-index: 2;
            opacity: 0;
            animation: entradaPersonagem 1.5s ease 0.5s forwards;
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.8));
            object-fit: contain;
        }

        .personagem.ruim {
            filter: drop-shadow(0 0 40px rgba(0,0,0,0.8)) brightness(0.5) saturate(0.2);
        }

        .conteudo {
            position: relative;
            z-index: 10;
            max-width: 520px;
            padding: 0 2rem;
            margin-left: 6%;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        .final-label {
            font-family: 'DMSans', sans-serif;
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .final-label.bom { color: rgba(100, 200, 100, 0.7); }
        .final-label.ruim { color: rgba(180, 60, 60, 0.7); }

        .final-texto {
            font-family: 'DMSans', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255,255,255,0.82);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .divisor {
            width: 30px;
            height: 1px;
            margin-bottom: 1.5rem;
        }

        .divisor.bom { background: rgba(100, 200, 100, 0.5); }
        .divisor.ruim { background: rgba(180, 60, 60, 0.5); }

        .final-mensagem {
            font-family: 'DMSans', sans-serif;
            font-size: 0.82rem;
            font-weight: 300;
            color: rgba(255,255,255,0.45);
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .cvv {
            color: rgba(255,255,255,0.85);
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .acoes {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .btn-reiniciar {
            font-family: 'DMSans', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 2px;
            transition: all 0.3s;
        }

        .btn-reiniciar:hover { color: #fff; border-bottom-color: #fff; }

        .btn-menu {
            font-family: 'DMSans', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            transition: color 0.3s;
        }

        .btn-menu:hover { color: rgba(255,255,255,0.6); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes entradaPersonagem {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <img class="fundo" src="{{ url_for('static', filename=dados.frame) }}" alt="">
    <div class="overlay {{ dados.tipo }}"></div>
    <img class="personagem {{ dados.tipo }}" src="{{ url_for('static', filename=dados.frame) }}" alt="Molly">

    <div class="conteudo">
        <div class="final-label {{ dados.tipo }}">
            {% if dados.tipo == 'bom' %}Final — ela escolheu{% else %}Final — ela não conseguiu{% endif %}
        </div>

        <div class="final-texto" id="textoFinal">{{ dados.texto }}</div>

        <div class="divisor {{ dados.tipo }}"></div>

        <div class="final-mensagem">
            {% if dados.tipo == 'ruim' %}
                {{ dados.mensagem | replace('CVV: 188', '<span class="cvv">CVV: 188</span>') | safe }}
            {% else %}
                {{ dados.mensagem }}
            {% endif %}
        </div>

        <div class="acoes">
            <a href="/reiniciar" class="btn-reiniciar">jogar novamente</a>
            <a href="/" class="btn-menu">menu</a>
        </div>
    </div>

    <script>
        const textoEl = document.getElementById('textoFinal');
        const original = textoEl.textContent.trim();
        textoEl.textContent = '';
        let i = 0;

        function digitar() {
            if (i < original.length) {
                textoEl.textContent += original[i++];
                setTimeout(digitar, 22);
            }
        }

        setTimeout(digitar, 1400);

        document.addEventListener('click', () => {
            if (i < original.length) { i = original.length; textoEl.textContent = original; }
        });
    </script>

</body>
</html>
